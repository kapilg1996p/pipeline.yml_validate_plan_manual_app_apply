pool: default

trigger:
- main
- feature/*

stages:

  - stage: terraformvalidate
    displayName: validate

    jobs:
      - job: validate
        displayName: validate
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'tf-pipeline'
            backendAzureRmOverrideSubscriptionID: '5a35d30d-6a8d-482a-b237-15a1133eecd8'
            backendAzureRmResourceGroupName: 'pipeline-rg'
            backendAzureRmStorageAccountName: 'pipelinestgk'
            backendAzureRmContainerName: 'pipeline-con-k'
            backendAzureRmKey: 'terraform.tfstate'
        
        - task: TerraformTask@5
          displayName: validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'

  - stage: terraformPlan
    displayName: terraform plan
    jobs:
      - job: terraformPlan
        displayName: terraform Plan
        steps:
        - task: TerraformInstaller@1
          displayName: terraform install
          inputs:
            terraformVersion: 'latest'

        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'tf-pipeline'
            backendAzureRmOverrideSubscriptionID: '5a35d30d-6a8d-482a-b237-15a1133eecd8'
            backendAzureRmResourceGroupName: 'pipeline-rg'
            backendAzureRmStorageAccountName: 'pipelinestgk'
            backendAzureRmContainerName: 'pipeline-con-k'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          displayName: plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            environmentServiceNameAzureRM: 'tf-pipeline'
            environmentAzureRmOverrideSubscriptionID: '5a35d30d-6a8d-482a-b237-15a1133eecd8'
        
  - stage: manualApproval
    pool: server
    jobs:
      - job: manualApplroval
        displayName: manualApproval
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'before approve the apply request.. kindly review the plan stage code'

  - stage: terraformApply
    jobs:
      - job: terraformApply
        displayName: terraformApply
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'tf-pipeline'
            backendAzureRmOverrideSubscriptionID: '5a35d30d-6a8d-482a-b237-15a1133eecd8'
            backendAzureRmResourceGroupName: 'pipeline-rg'
            backendAzureRmStorageAccountName: 'pipelinestgk'
            backendAzureRmContainerName: 'pipeline-con-k'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            environmentServiceNameAzureRM: 'tf-pipeline'
            environmentAzureRmOverrideSubscriptionID: '5a35d30d-6a8d-482a-b237-15a1133eecd8'
        